name: Release All Platforms (Windows / macOS / Android / iOS / Docker)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本号（如 v2.1.0）"
        required: false
        default: "v2.1.0"

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Windows (.exe Setup & Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: clients/desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows installers
        working-directory: clients/desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            clients/desktop/release/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (.dmg arm64 & x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: clients/desktop
        run: npm install --no-audit --no-fund
      - name: Build macOS DMG packages
        working-directory: clients/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            clients/desktop/release/*.dmg
          if-no-files-found: error

  build-mobile:
    name: Build Android (.apk) & iOS Xcode Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor mobile dependencies
        working-directory: clients/mobile
        run: npm install --no-audit --no-fund
      - name: Add Android & iOS platforms and sync Android
        working-directory: clients/mobile
        run: |
          npx cap add android
          npx cap sync android
          npx cap add ios || true
          mkdir -p release
      - name: Compile Android APK
        working-directory: clients/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/TaoGuan-LawLink-Android.apk
      - name: Archive iOS Xcode project for macOS signing
        working-directory: clients/mobile
        run: |
          if [ -d ios ]; then
            zip -r release/TaoGuan-LawLink-iOS-Xcode-Project.zip ios capacitor.config.json public package.json README_MOBILE.md
          else
            zip -r release/TaoGuan-LawLink-iOS-Xcode-Project.zip capacitor.config.json public package.json README_MOBILE.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-artifacts
          path: |
            clients/mobile/release/*.apk
            clients/mobile/release/*.zip
          if-no-files-found: error

  publish-docker:
    name: Build & Push Public Docker Image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-mobile, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Resolve Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.release_tag || 'v2.1.0' }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release with Multi-Platform Installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "韬冠律所全流程综合管理系统 ${{ steps.tag.outputs.value }}"
          generate_release_notes: true
          files: |
            release-files/*.exe
            release-files/*.dmg
            release-files/*.apk
            release-files/*.zip
